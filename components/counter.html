<style>
*, *::before, *::after { box-sizing: border-box; }
:host { display: block; color: var(--text); font: 16px/1.65 var(--font); -webkit-font-smoothing: antialiased; }
:host, main, section, article, div { min-width: 0; }
::selection { background: #2563eb30; color: var(--ink); }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: wait; opacity: .6; }
button, a, input, summary { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
a:hover { color: var(--accent); }
button, a { transition: background .18s, border-color .18s, color .18s, box-shadow .18s; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); color: var(--ink); letter-spacing: -.035em; line-height: 1.25; }
h1 { font-size: clamp(36px, 4vw, 56px); font-weight: 700; }
h2 { font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; }
h3 { font-size: 20px; font-weight: 600; }
svg { display: inline-block; width: 20px; height: 20px; vertical-align: middle; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg use { pointer-events: none; }
code, pre, .mono, kbd { font-family: var(--mono); }
kbd { font-size: 10px; padding: 1px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; }
main { padding-top: 65px; min-height: 65vh; }
pre { margin: 0; white-space: pre; overflow: auto; font-size: 12px; line-height: 1.9; tab-size: 2; }
.counter { text-align: center; background: var(--bg); border: 1px solid var(--line); padding: 24px 14px; border-radius: 10px; }
.counter-label { font: 11px var(--mono); letter-spacing: .07em; color: var(--muted); }
.counter-controls { display: flex; align-items: center; justify-content: center; gap: 23px; margin: 18px 0 12px; }
.counter-controls button { width: 42px; height: 42px; border: 1px solid var(--strong-line); border-radius: 8px; background: var(--surface); font-size: 23px; }
.counter-controls button:last-child { background: #2563eb; color: white; border-color: #2563eb; }
.counter-controls button:hover { border-color: var(--accent); box-shadow: 0 2px 12px #2563eb25; }
.counter-output { color: var(--accent); min-width: 75px; font: 700 48px/1 var(--display); font-variant-numeric: tabular-nums; }
.reset { background: none; border: 0; text-decoration: underline; text-underline-offset: 4px; font: 11px var(--mono); color: var(--muted); padding: 8px; }
.counter .mono { font-size: 10px; color: var(--muted); margin-top: 10px; }
@media (max-width: 767px) {
  main { padding-top: 61px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<div class="counter">
  <div class="counter-label">{{ state.label }}</div>
  <div class="counter-controls"><button type="button" ns-bind-aria-label="state.t.decrement" ns-on-click="actions.decrement">−</button><output class="counter-output" aria-live="polite" aria-atomic="true">{{ state.value.count }}</output><button type="button" ns-bind-aria-label="state.t.increment" ns-on-click="actions.increment">+</button></div>
  <button class="reset" type="button" ns-on-click="actions.resetCount">{{ state.t.reset }}</button>
  <p class="mono">{{ state.t.count }}</p>
</div>

<script ns-behavior type="module">
  import { createState, attribute } from 'nanshann';
  import { localized, localize } from 'site/util.js';
  export default function counter(ctx) {
    const value = createState({ count: 42 });
    return { state: localize(ctx, base => ({ ...base, value, get label() { return ctx.attributes.label.get(); } })), actions: {
      increment() { value.count++; }, decrement() { value.count--; }, resetCount() { value.count = 42; },
    } };
  }
  counter.attributes = { ...localized, label: attribute('state.count') };
</script>
