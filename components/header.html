<style>
*, *::before, *::after { box-sizing: border-box; }
:host { display: block; color: var(--text); font: 16px/1.65 var(--font); -webkit-font-smoothing: antialiased; }
:host, main, section, article, div { min-width: 0; }
::selection { background: #2563eb30; color: var(--ink); }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: wait; opacity: .6; }
button, a, input, summary { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
a:hover { color: var(--accent); }
button, a { transition: background .18s, border-color .18s, color .18s, box-shadow .18s; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); color: var(--ink); letter-spacing: -.035em; line-height: 1.25; }
h1 { font-size: clamp(36px, 4vw, 56px); font-weight: 700; }
h2 { font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; }
h3 { font-size: 20px; font-weight: 600; }
svg { display: inline-block; width: 20px; height: 20px; vertical-align: middle; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg use { pointer-events: none; }
code, pre, kbd { font-family: var(--mono); }
.wrap { width: min(100% - 64px, 1216px); margin-inline: auto; }
.icon-button { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
.icon-button:hover { color: var(--accent); border-color: var(--accent); }
.icon-button svg { width: 17px; height: 17px; }
.site-header { position: fixed; inset: 0 0 auto; height: 65px; z-index: 100; background: var(--header); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; height: 100%; }
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); font-size: 16px; font-weight: 650; letter-spacing: -.035em; white-space: nowrap; }
.brand img { width: auto; height: 31px; flex-shrink: 0; }
.brand small { font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.brand-group { display: flex; gap: 14px; align-items: center; }
.version { font: 10px var(--mono); padding: 4px 8px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--line); }
.nav { display: flex; align-items: center; gap: 3px; }
.nav > a, .nav-trigger { display: flex; align-items: center; gap: 4px; border: 1px solid transparent; border-radius: 7px; padding: 7px 12px; font-size: 14px; background: transparent; white-space: nowrap; }
.nav [aria-current='page'], .nav-trigger.active { color: var(--ink); background: var(--soft); border-color: var(--line); font-weight: 600; }
.nav > a:hover, .nav-trigger:hover { background: var(--soft); color: var(--ink); }
.nav-trigger svg { width: 13px; height: 13px; }
.dropdown { position: relative; }
.dropdown-panel { position: absolute; top: calc(100% + 10px); left: 0; width: 190px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 6px; box-shadow: var(--shadow); }
.dropdown-panel a { display: block; padding: 10px 12px; font-size: 14px; border-radius: 5px; }
.dropdown-panel a:hover { background: var(--soft); }
.header-tools { display: flex; align-items: center; gap: 8px; }
.search-trigger { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: var(--soft); padding: 6px 9px; font-size: 12px; }
.search-trigger svg { width: 14px; height: 14px; }
kbd { font-size: 10px; padding: 1px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; }
.language-switch { height: 34px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; font-size: 12px; }
.menu-trigger { display: none; }
main { padding-top: 65px; min-height: 65vh; }
pre { margin: 0; white-space: pre; overflow: auto; font-size: 12px; line-height: 1.9; tab-size: 2; }
@media (max-width: 1100px) {
  .version { display: none; }
  .header-inner { gap: 10px; }
  .nav > a, .nav-trigger { padding-inline: 9px; }
  .search-trigger span, .search-trigger kbd { display: none; }
}
@media (max-width: 767px) {
  .wrap { width: calc(100% - 40px); }
  .site-header { height: 61px; }
  .brand small, .header-tools > a { display: none; }
  .brand img { height: 27px; }
  .brand { font-size: 15px; }
  .header-tools { gap: 6px; }
  .menu-trigger { display: inline-flex; }
  .search-trigger { background: transparent; padding: 8px; }
  .header-inner { gap: 8px; }
  .nav { display: none; position: absolute; top: 60px; inset-inline: 0; padding: 18px 20px 24px; border-bottom: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
  .nav.open { display: flex; flex-direction: column; align-items: stretch; gap: 5px; }
  .nav > a, .nav-trigger { font-size: 16px; padding: 11px 14px; width: 100%; }
  .dropdown-panel { position: static; width: auto; margin: 4px 14px; box-shadow: none; border: 0; border-left: 1px solid var(--line); border-radius: 0; }
  main { padding-top: 61px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
<!-- Feather 4.29.2 icons, Copyright (c) 2013-2023 Cole Bemis (MIT). See /licenses/feather-MIT.txt and /assets/feather-icons.json. -->

<header class="site-header">
  <div class="header-inner wrap">
    <div class="brand-group"><a class="brand" ns-bind-href="state.links.home"><img src="/assets/mark.svg" alt=""><span>nanshann</span><small></small></a><span class="version">● v0.1-preview</span></div>
    <nav id="primary-navigation" class="nav" ns-bind-class="state.navClass" ns-bind-aria-label="state.navLabel">
      <a ns-foreach="item of state.nav" ns-key="item.id" ns-bind-href="item.href" ns-bind-aria-current="item.current">{{ item.label }}</a>
      <div class="dropdown">
        <button data-ecosystem class="nav-trigger" ns-bind-class="state.ecosystemClass" ns-bind-aria-expanded="state.ecosystemOpen" aria-controls="ecosystem-links" ns-on-click="actions.toggleEcosystem" type="button">{{ state.t.ecosystem }}<svg aria-hidden="true" class="" viewBox="0 0 24 24" data-feather="chevron-down"><polyline points="6 9 12 15 18 9"/></svg></button>
        <div id="ecosystem-links" class="dropdown-panel" ns-bind-hidden="state.ecosystemHidden"><a ns-bind-href="state.links.components">{{ state.t.components }}</a><a ns-bind-href="state.links.showcase">{{ state.t.showcase }}</a></div>
      </div>
      <a ns-bind-href="state.links.about" ns-bind-aria-current="state.aboutCurrent">{{ state.t.about }}</a>
    </nav>
    <div class="header-tools">
      <button class="search-trigger" type="button" ns-bind-aria-label="state.t.searchLabel" ns-on-click="actions.search"><svg aria-hidden="true" class="" viewBox="0 0 24 24" data-feather="search"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>{{ state.t.search }}</span><kbd>⌘ K</kbd></button>
      <button class="language-switch" type="button" ns-bind-aria-label="state.t.language" ns-on-click="actions.changeLanguage">{{ state.languageText }}</button>
      <button class="icon-button" data-theme-switch type="button" ns-bind-aria-label="state.themeLabel" ns-bind-title="state.themeLabel" ns-on-click="actions.toggleTheme"><svg aria-hidden="true" viewBox="0 0 24 24" ns-html="state.themeIcon"></svg></button>
      <a class="icon-button" ns-bind-href="state.repository" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><svg aria-hidden="true" viewBox="0 0 24 24" data-feather="github"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg></a>
      <button class="icon-button menu-trigger" data-menu aria-controls="primary-navigation" type="button" ns-bind-aria-label="state.t.menu" ns-bind-aria-expanded="state.mobileOpen" ns-on-click="actions.toggleMenu"><svg aria-hidden="true" class="" viewBox="0 0 24 24" data-feather="menu"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
</header>

<script ns-behavior type="module">
  import { icons } from 'site-assets/icons.js';
  import { attribute, createState } from 'nanshann';
  import { dispatch, localized, localize } from 'site/util.js';
  export default function header(ctx) {
    const ui = createState({ mobile: false, ecosystem: false });
    const state = localize(ctx, base => {
      const current = ctx.attributes.current.get();
      return { ...base,
        navLabel: base.locale === 'zh' ? '主导航' : 'Main navigation',
        nav: ['home', 'docs', 'blog'].map(key => ({ id: key, label: base.t[key], href: base.links[key], current: current === key ? 'page' : null })),
        aboutCurrent: current === 'about' ? 'page' : null,
        ecosystemClass: ['components', 'showcase'].includes(current) ? 'active' : '',
        languageText: base.locale === 'zh' ? 'EN' : '中文',
        get mobileOpen() { return ui.mobile; }, get navClass() { return ui.mobile ? 'open' : ''; },
        get ecosystemOpen() { return ui.ecosystem; }, get ecosystemHidden() { return !ui.ecosystem; },
        get themeLabel() { return ctx.attributes.theme.get() === 'dark' ? base.t.themeLight : base.t.themeDark; },
        get themeIcon() { return icons[ctx.attributes.theme.get() === 'dark' ? 'sun' : 'moon']; },
      };
    });
    let host;
    const closeMenu = () => { ui.mobile = false; ui.ecosystem = false; };
    ctx.onMount(element => {
      host = element;
      const outside = event => { if (!event.composedPath().includes(host)) closeMenu(); };
      const key = event => {
        if (event.key === 'Escape') {
          if (ui.ecosystem) { ui.ecosystem = false; host.shadowRoot.querySelector('[data-ecosystem]').focus(); }
          else if (ui.mobile) { ui.mobile = false; host.shadowRoot.querySelector('[data-menu]').focus(); }
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); dispatch(host, 'search-open'); }
      };
      document.addEventListener('click', outside);
      document.addEventListener('keydown', key);
      ctx.onDispose(() => { document.removeEventListener('click', outside); document.removeEventListener('keydown', key); });
    });
    return { state, actions: {
      closeMenu,
      toggleMenu() { ui.mobile = !ui.mobile; ui.ecosystem = false; },
      toggleEcosystem() { ui.ecosystem = !ui.ecosystem; },
      toggleTheme() { dispatch(host, 'theme-change'); },
      changeLanguage() { dispatch(host, 'language-change'); },
      search() { closeMenu(); dispatch(host, 'search-open'); },
    } };
  }
  header.attributes = { ...localized, current: attribute('home'), theme: attribute('light') };
</script>
