<style>
*, *::before, *::after { box-sizing: border-box; }
:host { display: block; color: var(--text); font: 16px/1.65 var(--font); -webkit-font-smoothing: antialiased; }
:host, main, section, article, div { min-width: 0; }
::selection { background: #2563eb30; color: var(--ink); }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: wait; opacity: .6; }
button, a, input, summary { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
a:hover { color: var(--accent); }
button, a { transition: background .18s, border-color .18s, color .18s, box-shadow .18s; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); color: var(--ink); letter-spacing: -.035em; line-height: 1.25; }
h1 { font-size: clamp(36px, 4vw, 56px); font-weight: 700; }
h2 { font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; }
h3 { font-size: 20px; font-weight: 600; }
svg { display: inline-block; width: 20px; height: 20px; vertical-align: middle; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg use { pointer-events: none; }
code, pre, .eyebrow, kbd { font-family: var(--mono); }
.eyebrow { font-size: 12px; letter-spacing: .09em; color: var(--accent); text-transform: uppercase; line-height: 1.6; }
kbd { font-size: 10px; padding: 1px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; }
main { padding-top: 65px; min-height: 65vh; }
pre { margin: 0; white-space: pre; overflow: auto; font-size: 12px; line-height: 1.9; tab-size: 2; }
.text-link { color: var(--accent); font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.text-link svg { width: 16px; }
.article-header h1 { font-size: clamp(32px, 3.6vw, 46px); margin-bottom: 18px; }
.article-header > p { font-size: 18px; color: var(--muted); line-height: 1.8; }
.article-header { padding-bottom: 32px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
.article-meta { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 24px; }
.article-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 48px; padding-top: 30px; border-top: 1px solid var(--line); }
.article-nav a { border: 1px solid var(--line); border-radius: 8px; padding: 16px; font-size: 15px; }
.article-nav a:hover { border-color: var(--accent); }
.article-nav small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
.article-nav a:last-child { text-align: right; }
.article-wrap { width: min(100% - 48px, 790px); margin: auto; padding: 60px 0 90px; }
.article-wrap .article-header { margin-top: 30px; }
.article-wrap h1 { font-size: clamp(34px, 4.5vw, 54px); }
@media (max-width: 767px) {
  main { padding-top: 61px; }
  .article-header h1 { font-size: 32px; }
  .article-header > p { font-size: 16px; }
  .article-wrap { padding-top: 32px; }
  .article-wrap h1 { font-size: 35px; }
  .article-nav { gap: 12px; }
  .article-nav a { font-size: 13px; padding: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
<article class="article-wrap"><a class="text-link" ns-bind-href="state.links.blog">{{ state.t.back }}</a><header class="article-header"><span class="eyebrow">{{ state.category }} · {{ state.copy.series }}</span><h1 style="margin-top: 18px">{{ state.title }}</h1><p>{{ state.description }}</p><div class="article-meta"><span>{{ state.copy.articleAuthor }}</span><span>{{ state.time }}</span></div></header><ns-include ns-bind-src="state.src"></ns-include><nav class="article-nav"><a ns-bind-href="state.links.blog"><small>{{ state.t.blog }}</small>{{ state.t.back }}</a><a ns-bind-href="state.next.href"><small>{{ state.t.next }}</small>{{ state.next.title }}</a></nav></article>
<script ns-behavior type="module">
  import { attribute } from 'nanshann';
  import { postItems, pageCopy } from 'site-content/catalog.js';
  import { localized, localize, pageReady } from 'site/util.js';
  export default function article(ctx) {
    pageReady(ctx);
    return { state: localize(ctx, base => {
      const id = ctx.attributes.article.get();
      const items = postItems(base.locale);
      const index = items.findIndex(item => item.id === id);
      if (index < 0) throw new Error(`Unknown blog article: ${id}`);
      return { ...base, copy: pageCopy[base.locale], ...items[index], src: `/content/${base.locale}/blog/${id}.html`, next: items[(index + 1) % items.length] };
    }), actions: {} };
  }
  article.attributes = { ...localized, article: attribute('') };
</script>
