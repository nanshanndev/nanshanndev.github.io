<style>
*, *::before, *::after { box-sizing: border-box; }
:host { display: block; color: var(--text); font: 16px/1.65 var(--font); -webkit-font-smoothing: antialiased; }
:host, main, section, article, div { min-width: 0; }
::selection { background: #2563eb30; color: var(--ink); }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: wait; opacity: .6; }
button, a, input, summary { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
a:hover { color: var(--accent); }
button, a { transition: background .18s, border-color .18s, color .18s, box-shadow .18s; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); color: var(--ink); letter-spacing: -.035em; line-height: 1.25; }
h1 { font-size: clamp(36px, 4vw, 56px); font-weight: 700; }
h2 { font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; }
h3 { font-size: 20px; font-weight: 600; }
svg { display: inline-block; width: 20px; height: 20px; vertical-align: middle; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg use { pointer-events: none; }
code, pre, kbd { font-family: var(--mono); }
.wrap { width: min(100% - 64px, 1216px); margin-inline: auto; }
.accent { color: var(--accent); }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 46px; padding: 11px 24px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 14px; font-weight: 500; line-height: 1.5; }
.button:hover { border-color: var(--accent); color: var(--accent); }
kbd { font-size: 10px; padding: 1px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; }
main { padding-top: 65px; min-height: 65vh; }
pre { margin: 0; white-space: pre; overflow: auto; font-size: 12px; line-height: 1.9; tab-size: 2; }
.note { display: flex; align-items: start; gap: 10px; font-size: 12px; line-height: 1.8; border: 1px solid var(--line); border-radius: 7px; background: var(--accent-soft); padding: 13px; }
.note svg { color: var(--accent); width: 17px; margin-top: 3px; }
.docs-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 54px; padding-block: 38px 80px; }
.docs-sidebar { align-self: start; position: sticky; top: 100px; }
.docs-sidebar h2 { font: 11px var(--mono); letter-spacing: .08em; color: var(--muted); margin: 24px 12px 14px; }
.docs-sidebar a { display: block; padding: 9px 12px; border-radius: 6px; font-size: 14px; margin: 3px 0; }
.docs-sidebar a[aria-current='page'] { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.docs-sidebar a:hover { background: var(--soft); }
.docs-search { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
.docs-main { max-width: 820px; }
.breadcrumb { display: flex; gap: 8px; color: var(--muted); font-size: 12px; margin-bottom: 28px; }
.breadcrumb svg { width: 12px; }
.article-header h1 { font-size: clamp(32px, 3.6vw, 46px); margin-bottom: 18px; }
.article-header > p { font-size: 18px; color: var(--muted); line-height: 1.8; }
.article-header { padding-bottom: 32px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
.article-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 48px; padding-top: 30px; border-top: 1px solid var(--line); }
.article-nav a { border: 1px solid var(--line); border-radius: 8px; padding: 16px; font-size: 15px; }
.article-nav a:hover { border-color: var(--accent); }
.article-nav small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
.article-nav a:last-child { text-align: right; }
.docs-menu { display: none; }
@media (max-width: 1100px) {
  .docs-layout { gap: 32px; grid-template-columns: 190px minmax(0,1fr); }
}
@media (max-width: 767px) {
  .wrap { width: calc(100% - 40px); }
  main { padding-top: 61px; }
  .docs-layout { display: block; padding-top: 20px; }
  .docs-menu { display: flex; width: 100%; justify-content: space-between; margin-bottom: 20px; }
  .docs-sidebar { display: none; position: static; padding: 10px; margin-bottom: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .docs-sidebar.open { display: block; }
  .article-header h1 { font-size: 32px; }
  .article-header > p { font-size: 16px; }
  .article-nav { gap: 12px; }
  .article-nav a { font-size: 13px; padding: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
.article-nav .previous { text-align: left; }
.article-nav .next { grid-column: 2; text-align: right; }
</style>
<!-- Feather 4.29.2 icons, Copyright (c) 2013-2023 Cole Bemis (MIT). See /licenses/feather-MIT.txt and /assets/feather-icons.json. -->
<div class="docs-layout wrap">
  <button class="button docs-menu" type="button" ns-bind-aria-expanded="state.menuOpen" aria-controls="docs-sidebar" ns-on-click="actions.toggleMenu">{{ state.t.contents }}<svg aria-hidden="true" viewBox="0 0 24 24" data-feather="chevron-down"><polyline points="6 9 12 15 18 9"/></svg></button>
  <aside class="docs-sidebar" id="docs-sidebar" ns-bind-class="state.menuClass"><button class="docs-search" type="button" ns-on-click="actions.search">{{ state.t.search }}<svg aria-hidden="true" viewBox="0 0 24 24" data-feather="search"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button><h2>NANSHANN · v0.1</h2><nav ns-bind-aria-label="state.t.contents"><a ns-foreach="item of state.items" ns-key="item.id" ns-bind-href="item.href" ns-bind-aria-current="item.current">{{ item.title }}</a></nav></aside>
  <article class="docs-main"><div class="breadcrumb"><a ns-bind-href="state.links.docs">{{ state.t.docs }}</a> / <span>{{ state.title }}</span></div><header class="article-header"><h1>{{ state.title }}</h1><p>{{ state.description }}</p></header><ns-include ns-bind-src="state.src"></ns-include><div class="note"><span>{{ state.copy.docNotice }} <a class="accent" ns-bind-href="state.canonical" target="_blank" rel="noopener noreferrer">{{ state.copy.canonical }}</a></span></div><nav class="article-nav"><a class="previous" ns-if="state.hasPrevious" ns-bind-href="state.previous.href"><small>{{ state.t.previous }}</small>{{ state.previous.title }}</a><a class="next" ns-if="state.hasNext" ns-bind-href="state.next.href"><small>{{ state.t.next }}</small>{{ state.next.title }}</a></nav></article>
</div>
<script ns-behavior type="module">
  import { attribute, createState } from 'nanshann';
  import { documentItems, pageCopy } from 'site-content/catalog.js';
  import { localized, localize, dispatch, pageReady } from 'site/util.js';
  export default function docs(ctx) {
    const ui = createState({ menu: false });
    let host;
    ctx.onMount(element => { host = element; });
    pageReady(ctx);
    const state = localize(ctx, base => {
      const article = ctx.attributes.article.get() || 'getting-started';
      const items = documentItems(base.locale);
      const index = items.findIndex(item => item.id === article);
      if (index < 0) throw new Error(`Unknown documentation article: ${article}`);
      const current = items[index];
      const canonicalFile = { 'getting-started': 'deployment', routing: 'template' }[article] || article;
      return { ...base, copy: pageCopy[base.locale], title: current.title, description: current.description,
        items: items.map(item => ({ ...item, current: item.id === article ? 'page' : null })),
        src: `/content/${base.locale}/docs/${article}.html`,
        previous: items[Math.max(index - 1, 0)], next: items[Math.min(index + 1, items.length - 1)],
        hasPrevious: index > 0, hasNext: index < items.length - 1,
        canonical: `${base.repository}/blob/master/docs/reference/${canonicalFile}.md`,
        get menuOpen() { return ui.menu; }, get menuClass() { return ui.menu ? 'open' : ''; },
      };
    });
    return { state, actions: { toggleMenu() { ui.menu = !ui.menu; }, search() { dispatch(host, 'search-open'); } } };
  }
  docs.attributes = { ...localized, article: attribute('getting-started') };
</script>
