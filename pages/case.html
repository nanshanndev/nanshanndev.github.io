<style>
*, *::before, *::after { box-sizing: border-box; }
:host { display: block; color: var(--text); font: 16px/1.65 var(--font); -webkit-font-smoothing: antialiased; }
:host, main, section, article, div { min-width: 0; }
::selection { background: #2563eb30; color: var(--ink); }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: wait; opacity: .6; }
button, a, input, summary { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
a:hover { color: var(--accent); }
button, a { transition: background .18s, border-color .18s, color .18s, box-shadow .18s; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); color: var(--ink); letter-spacing: -.035em; line-height: 1.25; }
h1 { font-size: clamp(36px, 4vw, 56px); font-weight: 700; }
h2 { font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; }
h3 { font-size: 20px; font-weight: 600; }
svg { display: inline-block; width: 20px; height: 20px; vertical-align: middle; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg use { pointer-events: none; }
code, pre, .eyebrow, kbd { font-family: var(--mono); }
.wrap { width: min(100% - 64px, 1216px); margin-inline: auto; }
.eyebrow { font-size: 12px; letter-spacing: .09em; color: var(--accent); text-transform: uppercase; line-height: 1.6; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 46px; padding: 11px 24px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 14px; font-weight: 500; line-height: 1.5; }
.button:hover { border-color: var(--accent); color: var(--accent); }
kbd { font-size: 10px; padding: 1px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; }
main { padding-top: 65px; min-height: 65vh; }
pre { margin: 0; white-space: pre; overflow: auto; font-size: 12px; line-height: 1.9; tab-size: 2; }
.page-intro { padding: 82px 0 48px; max-width: 800px; }
.page-intro h1 { margin: 15px 0 20px; }
.page-intro p { font-size: 18px; line-height: 1.8; color: var(--muted); }
.page-body { min-height: 60vh; padding-bottom: 90px; }
.text-link { color: var(--accent); font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.text-link svg { width: 16px; }
.split-content { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; padding-block: 48px; border-top: 1px solid var(--line); }
.split-content p { margin-top: 18px; }
.prose { color: var(--text); max-width: 100%; font-size: 16px; line-height: 1.85; }
.prose h2 { margin: 42px 0 18px; font-size: 25px; scroll-margin-top: 100px; }
.prose h3 { margin: 30px 0 14px; font-size: 20px; }
.prose p { margin: 16px 0; }
.prose ul, .prose ol { padding-left: 24px; margin: 20px 0; }
.prose li { margin: 8px 0; }
.prose a { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
.prose code:not(pre code) { font-size: .85em; padding: 2px 5px; background: var(--soft); border-radius: 4px; color: var(--accent); overflow-wrap: anywhere; }
.prose pre { padding: 22px; margin: 20px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; font-size: 13px; line-height: 1.8; }
.prose aside { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 16px 22px; margin: 24px 0; font-size: 14px; }
.prose table { width: 100%; border-collapse: collapse; margin-block: 24px; font-size: 14px; }
.prose th, .prose td { text-align: left; padding: 12px; border-bottom: 1px solid var(--line); }
.prose th { color: var(--ink); background: var(--soft); font-weight: 500; }
.prose blockquote { margin: 24px 0; padding: 10px 24px; border-left: 3px solid var(--accent); color: var(--ink); font-size: 22px; }
.demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin: 32px 0; }
.demo-tile { padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.demo-tile h3 { margin-bottom: 20px; font-size: 16px; }
@media (max-width: 767px) {
  .wrap { width: calc(100% - 40px); }
  main { padding-top: 61px; }
  .page-intro { padding: 48px 0 32px; }
  .page-intro p { font-size: 16px; }
  .split-content, .demo-grid { grid-template-columns: 1fr; }
  .split-content { gap: 32px; }
  .page-body { padding-bottom: 55px; }
  .prose { font-size: 15px; }
  .prose pre { font-size: 12px; padding: 16px; }
  .prose h2 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
<div class="wrap page-body"><header class="page-intro"><a class="eyebrow" ns-bind-href="state.links.showcase">ECOSYSTEM / SHOWCASE</a><h1>{{ state.copy.caseTitle }}</h1><p>{{ state.copy.caseIntro }}</p></header><div class="demo-grid"><section class="demo-tile"><h3>{{ state.copy.named }} · &lt;site-counter&gt;</h3><site-counter ns-bind-locale="state.locale" label="INSTANCE A"></site-counter></section><section class="demo-tile"><h3>{{ state.copy.included }} · &lt;ns-include&gt;</h3><ns-include data-counter src="/components/counter.html" ns-bind-locale="state.locale" label="INSTANCE B"></ns-include></section></div><button class="button" type="button" ns-on-click="actions.resetBoth">{{ state.copy.resetBoth }}</button><section class="split-content" style="margin-top: 50px"><div><h2>{{ state.copy.definitionTitle }}</h2><p>{{ state.copy.definitionDescription }}</p><a class="text-link" ns-bind-href="state.links.docs" style="margin-top: 24px">{{ state.t.docs }}</a></div><div class="prose"><pre><code>{{ state.code }}</code></pre></div></section></div>
<script ns-behavior type="module">
  import { pageCopy } from 'site-content/catalog.js';
  import { localized, localize, pageReady } from 'site/util.js';
  export default function casePage(ctx) {
    let host;
    ctx.onMount(element => { host = element; });
    pageReady(ctx);
    return { state: localize(ctx, base => ({ ...base, copy: pageCopy[base.locale],
      code: `import { createComponent } from 'nanshann';\nawait createComponent('site-counter', '/components/counter.html');\n\n<site-counter></site-counter>\n<ns-include src="/components/counter.html"></ns-include>`,
    })), actions: {
      async resetBoth() {
        const counters = [...host.shadowRoot.querySelectorAll('site-counter, ns-include[data-counter]')];
        await Promise.all(counters.map(counter => counter.ready));
        if (counters.every(counter => counter.isConnected)) for (const counter of counters) counter.resetCount();
      },
    } };
  }
  casePage.attributes = localized;
</script>
